# conduit MITM proxy configuration

# Proxy listener address
listen_addr = "0.0.0.0:8888"

# Management API address
api_addr = "0.0.0.0:8443"

# Datastore (Valkey / Redis / Dragonfly) connection URL
dragonfly_url = "redis://127.0.0.1:6380"

# CA certificate and key paths (persisted locally)
ca_cert_path = "ca/ca.pem"
ca_key_path = "ca/ca-key.pem"

# Maximum number of cached per-domain TLS certificates
cert_cache_size = 10000

# Log channel buffer size (proxy never blocks on logging)
log_channel_size = 10000

# Redis connection pool size
redis_pool_size = 16

# Whether unauthenticated traffic should be rejected (407) or allowed with IP logging
# Set to false for host proxying
auth_required = false

# Maximum number of log entries retained in Dragonfly
log_retention = 100000

# Number of worker threads (default: number of CPUs)
# workers = 4

# Syslog target (optional): udp://host:514 or tcp://host:514
# Disabled for now - all logs reside locally in Dragonfly stream and stdout/logfile
# syslog_target = "udp://syslog.example.com:514"

# Path to the SvelteKit UI build directory
ui_dir = "./conduit-ui/build"

# TLS interception (MITM) — decrypt CONNECT tunnels to inspect full URLs
tls_intercept = true

# Fail-closed vs fail-open: false allows traffic if policy lookup fails
fail_closed = false

# --- HTTP Response Cache ---
[cache]
enabled = true
max_cache_size = 134217728      # 128MB total cache
max_file_size = 10485760        # 10MB max per response
lock_timeout_secs = 5           # How long a reader waits for a writer
stale_while_revalidate_secs = 60
stale_if_error_secs = 300

# --- Threat Detection (Active Inspection & Scoring, Monitoring Mode) ---
[threat]
enabled = true

# Tier 0: heuristics
tier0_escalation_threshold = 0.3   # Score above this -> escalate to Tier 1
tier0_block_threshold = 0.9        # Score above this -> block when prevention_mode is active
dga_entropy_threshold = 3.5        # Shannon entropy threshold for DGA detection

# Tier 1: ML decision tree (runs on ~2-5% of requests that T0 flags)
tier1_enabled = true
tier1_escalation_threshold = 0.5

# Tier 2: content inspection (runs on responses from T1-escalated requests)
tier2_enabled = true
tier2_escalation_threshold = 0.6
max_inspect_bytes = 262144         # 256KB of response body inspected
tier2_block_on_inspect = false     # Do not block during initial monitoring

# Tier 3: LLM verdict -- OFF for now
tier3_enabled = false

# Reputation: learns per-domain trust over time
reputation_enabled = true
reputation_decay_hours = 168       # 1 week half-life
reputation_block_threshold = 0.55  # Score above this -> block when prevention_mode is active

# Bloom filter for threat feeds
bloom_capacity = 2000000
bloom_fp_rate = 0.0001
feed_refresh_interval_secs = 3600  # Re-fetch feeds every hour

# --- Timeout Hardening ---
[timeouts]
connect_timeout_secs = 10
total_connection_timeout_secs = 15
read_timeout_secs = 60
write_timeout_secs = 60
idle_timeout_secs = 300
request_timeout_secs = 0              # 0 = disabled

# --- Request Size Limits ---
[request_limits]
max_request_header_size = 16384       # 16KB max headers
max_request_body_size = 20971520      # 20MB max body

# --- Graceful Shutdown ---
[shutdown]
grace_period_secs = 2
graceful_shutdown_timeout_secs = 5
upgrade_sock = "/tmp/conduit-upgrade.sock"

# --- Connection Limits ---
[connection_limits]
enabled = true
max_connections_per_ip = 1024         # per-IP concurrent connection cap

# --- DNS Cache ---
[dns]
enabled = true
max_entries = 10000
min_ttl_secs = 30
max_ttl_secs = 3600
negative_ttl_secs = 30

# --- Prometheus Metrics ---
[metrics]
enabled = true
listen_addr = "0.0.0.0:9091"

# --- DLP (Data Loss Prevention in Log/Audit Mode) ---
[dlp]
enabled = true
max_scan_size = 1048576               # 1MB scan limit
action = "log"                        # Log/audit mode rather than block
# Domains or wildcard patterns exempt from all DLP inspections
# (e.g. trusted container and package registries)
allowed_domains = [
    "*.pkg.dev",
    "*.docker.pkg.dev",
    "us-central1-docker.pkg.dev",
    "*.gcr.io",
    "docker.io",
    "*.docker.io",
    "ghcr.io",
    "*.ecr.*.amazonaws.com",
    "quay.io",
    "*.quay.io",
]

# --- In-line Package Security & Supply Chain Scanner (YARA-X) ---
[package_scanner]
enabled = true
action = "block"                      # "block" or "log"
max_package_size = 31457280           # 30MB max package archive size
max_file_scan_size = 2097152          # 2MB max per extracted script/manifest

# --- HTTP/2 Downstream ---
[downstream]
h2c = true

# --- Cluster Node Registration ---
[node]
node_id = "node-a45bca93-95d"
dragonfly_url = "redis://127.0.0.1:6380"
name = "mars-local"
heartbeat_interval_secs = 10

# --- Allowlist (Bypass SSRF protection, caching, and inspection for trusted targets) ---
[allowlist]
allow_loopback = true                    # Permits loopback traffic (localhost, 127.0.0.1, ::1)
min_loopback_port = 1024                 # Blocks privileged system ports (< 1024)
blocked_loopback_ports = [22, 2375, 2376, 3306, 5432, 6379, 6380, 11211, 27017] # Block sensitive DB/daemon ports
only_local_clients_for_loopback = true   # Prevent remote LAN clients from proxying into host loopback
hosts = [
    "localhost",
    "127.0.0.1",
    "::1",
    "mtalk.google.com",
    "34.136.148.92",
    "34.139.173.121",
    "35.190.142.72",
]
ports = [
    6443,
]

# --- Outbound Egress Port Restrictions ---
[egress]
# Allowed destination ports for CONNECT tunneling (HTTPS, WebSocket, Kubernetes API 6443).
# Non-allowlisted external traffic attempting to tunnel to other ports (e.g. 1234) is rejected.
allowed_connect_ports = [443, 8443, 6443]
# Allowed destination ports for plain HTTP proxying.
allowed_http_ports = [80, 8080]

# --- Desktop Notifications & Alert Muting ---
[notifications]
enabled = true
min_interval_secs = 2
# Domains or wildcard patterns where desktop notifications are silenced
# (Requests are still enforced and logged, but no toasts appear on screen)
muted_domains = [
    "browser-intake-us5-datadoghq.com",
    "*.datadoghq.com",
    "static.cloudflareinsights.com",
    "*.cloudflareinsights.com",
    "*.simpleanalyticscdn.com",
]



